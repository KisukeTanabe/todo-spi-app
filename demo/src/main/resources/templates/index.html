<!DOCTYPE html>

<!--
就職活動支援Webアプリ機能
1. 応援メッセージ表示
2. 時間帯別挨拶表示
3. SPI問題画面への遷移
4. Todo一覧表示
5. 締切間近タスク通知
-->

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<link rel="stylesheet" th:href="@{/css/style.css}"></link>

<title>応援メッセージと時間帯判定</title>

<style>

body{
    font-family: sans-serif;
    background-color:#f5f5f5;
    margin:30px;
}

.container{
    background-color:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.notice{
    background-color:#e8f6ff;
    border-left:5px solid #2da3d7;
    padding:10px;
    margin-bottom:20px;
}

.menu a{
    display:inline-block;
    background-color:#2da3d7;
    color:white;
    text-decoration:none;
    padding:10px 20px;
    margin-right:10px;
    border-radius:5px;
}

.menu a:hover{
    background-color:#198fc0;
}

.todo{
    background-color:#fafafa;
    border:1px solid #ddd;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
}
</style>

</head>


<body>

<div class="header">

    <h1>ToDo管理・SPI学習アプリ</h1>

    <div class="user-info" th:if="${username != null}">
        <span th:text="${username}"></span>さん
    </div>

    <div class="current-time">
        📅 [[${currentTime}]]
    </div>

</div>

<div class="top-area">
    <!-- 左側 -->

    <!-- 時間帯に応じた挨拶表示 -->

       <div class="character-area">
        
        <div class="message-area">
            <span th:text="${greeting}"></span>
               
            <h3 th:if="${userNotice}">
                [[${userNotice}]]
            </h3>
        </div>

       
    <!-- 右側 -->

     <!-- ランダム応援メッセージ -->
    <div class="greeting-bubble">
        <p th:text="${message}"></p>
        </div>

        <div class="character">
            😊
        </div>
        
       </div>

       <div class="dashboard">

<div class="dashboard-card">
    <h3>📚 学習日数</h3>
    <p>[[${studyDays}]]日</p>
</div>

<div class="dashboard-card">
    <h3>✅ 未完了タスク</h3>
    <p>[[${incompleteCount}]]件</p>
</div>

</div>




<!-- 締切が近いTodoを表示 -->
<div class="notice">

<h3 style="color:red">Todo一覧表示</h3>


<!-- Todo一覧表示 -->
<table class="todo-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>タスク</th>
            <th>締切</th>
        </tr>
    </thead>
<tbody>
    <tr th:each="todo : ${todos}">
        <td th:text="${todo.id}"></td>
        <td th:text="${todo.task}"></td>
        <td th:text="${#temporals.format(todo.deadline,'yyyy/MM/dd HH:mm')}"></td>
    </tr>
</tbody>

</table>

<!-- メニュー -->
<h4>メニュー</h4>

<div class="menu-container">
    <a href="/spi">
    <div class="menu-card">
        <div class="icon">📘</div>
    <h3>SPI学習</h3>
    <p>SPI問題に挑戦</p>
    </div>
    </a> 


<a href="/todo">
    <div class="menu-card">
        <div class="icon">✅</div>
    <h3>ToDo管理</h3>
    <p>タスクを確認</p>
    </div>
</a> 


<a href="/setting">
    <div class="menu-card">
        <div class="icon">⚙️</div>
    <h3>設定</h3>
    <p>ユーザー情報設定</p>
    </div>
</a> 

</div>


</body>

</html>
