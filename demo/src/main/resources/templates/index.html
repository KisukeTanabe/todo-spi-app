<!DOCTYPE html>

<!--
就職活動支援Webアプリ機能
1. 応援メッセージ表示
2. 時間帯別挨拶表示
3. SPI問題画面への遷移
4. Todo一覧表示
5. 締切間近タスク通知
-->

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<link rel="stylesheet" th:href="@{/css/style.css}"></link>

<title>応援メッセージと時間帯判定</title>

<style>

body{
    font-family:sans-serif;

    background:linear-gradient(
        135deg,
        #EEF6FF 0%,
        #DCEEFF 50%,
        #CDE4FF 100%
    );

    background-attachment:fixed;

    margin:30px;
    min-height:100vh;
}

.container{
    background-color:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.notice{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-top:30px;
    margin-bottom:30px;

    box-shadow:0 4px 15px rgba(0,0,0,0.1);

    border:none;
}

.menu a{
    display:inline-block;
    background-color:#2da3d7;
    color:white;
    text-decoration:none;
    padding:10px 20px;
    margin-right:10px;
    border-radius:5px;
}

.menu a:hover{
    background-color:#198fc0;
}

.todo{
    background-color:#fafafa;
    border:1px solid #ddd;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
}
</style>

</head>


<body>

<div class="app-container">

<div class="header">

    <h1>ToDo管理・SPI学習アプリ</h1>

    <div class="user-info" th:if="${username != null}">
        <span th:text="${username}"></span>さん
    </div>

    <div class="current-time">
        📅 [[${currentTime}]]
    </div>

</div>

<div class="top-area">
    <!-- 左側 -->

    <!-- 時間帯に応じた挨拶表示 -->

       <div class="character-area">
        
        <div class="message-area">
            <span th:text="${greeting}"></span>
               
            <h3 th:if="${userNotice}">
                [[${userNotice}]]
            </h3>
        </div>

       
    <!-- 右側 -->

     <!-- ランダム応援メッセージ -->
    <div class="greeting-bubble">
        <p th:text="${message}"></p>
        </div>

        <div class="character">
            😊
        </div>
        
       </div>

       <div class="dashboard">

<div class="dashboard-card">
    <h3>📚 学習日数</h3>
    <p>[[${studyDays}]]日</p>
</div>

<div class="dashboard-card">
    <h3>✅ 未完了タスク</h3>
    <p>[[${incompleteCount}]]件</p>
</div>

<div class="dashboard-card">
    <h3>📝 SPI挑戦回数</h3>
    <p th:text="${spiCount} ?: 0"></p>
</div>

</div>



<!-- 締切が近いTodoを表示 -->
</div>

</div>


<!-- 締切が近いTodoを表示 -->
<div class="notice">

<div class="chart-card">

    <h3>📈 SPI学習推移（7日間）</h3>

    <div class="bar-chart">

        <div
            th:each="count : ${graphData}"
            class="bar"
            th:style="'height:' + (${count} * 25 + 20) + 'px'">

            <span th:text="${count}"></span>

        </div>

    </div>

</div>

    <h3>📋 Todo一覧</h3>

    <div th:each="todo : ${todos}"
         th:class="${todo.completed} ? 'todo-card completed' : 'todo-card'">

        <div class="todo-header">
            <span class="todo-id">
                #<span th:text="${todo.id}"></span>
            </span>
        </div>

        <h4 th:text="${todo.task}"></h4>

        <p class="deadline">
            📅
            <span th:text="${#temporals.format(todo.deadline,'yyyy/MM/dd HH:mm')}"></span>
        </p>

        <p th:if="${todo.completed}" class="status-complete">
            ✅ 完了
        </p>

        <p th:unless="${todo.completed}" class="status-progress">
            ⏳ 進行中
        </p>

    </div>

</div>

<!-- メニュー -->
<h3>🚀 メニュー</h3>

<div class="menu-container">

    <a th:href="@{/spi}">
        <div class="menu-card">
            <div class="icon">📘</div>
            <h3>SPI学習</h3>
            <p>SPI問題に挑戦</p>
        </div>
    </a>

    <a th:href="@{/todo}">
        <div class="menu-card">
            <div class="icon">✅</div>
            <h3>ToDo管理</h3>
            <p>タスクを確認</p>
        </div>
    </a>

    <a th:href="@{/setting}">
        <div class="menu-card">
            <div class="icon">⚙️</div>
            <h3>設定</h3>
            <p>ユーザー情報設定</p>
        </div>
    </a>

</div>

</div> <!-- app-container -->

</body>

</html>
